<!doctype html>
<html lang = "es">
  <head>
    <meta charset = "utf-8" />
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0" />
    <title>Misión 2</title>
  </head>
  <body>
    <header>
      <h1>Near Earth Object Web Service</h1>
      <p><b>Asteroids NeoWs (NASA)</b></p>
      <p>Valeria Arcila Rodríguez</p>
    </header>
    <main>
      <section>
        <h2>Información semanal</h2>
        <p id = "estado"></p>
        <button id = "reintentar" class = "oculto" type = "button">Reintentar</button>
        <div class = "informacion">
          <div class = "contenedor">
            <h3>Asteroides detectados</h3>
            <p id = "numero">---</p>
          </div>
          <div class = "contenedor">
            <h3>Distancia mínima</h3>
            <p id = "distancia">---</p>
          </div>
        </div>
      </section>
      <section>
        <h2>Explorar asteroides</h2>
        <div class = "filtros">
          <button id = "todos" class = "activo" type = "button">Todos</button>
          <button id = "peligrosos" type = "button">Peligrosos</button>
          <button id = "rapidos" type = "button">Rápidos</button>
        </div>
        <div id = "logica"></div>
      </section>
    </main>
    <script type = "module" src = "/src/main.js"></script>
  </body>
</html>
